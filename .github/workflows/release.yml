name: Release

# Builds Windows (.msi/.exe) AND macOS (.dmg/.app) installers on tag push and
# attaches every artifact to a single GitHub Release.
#
# macOS signing: the job is wired to notarize IF Apple secrets are present in
# the repo's Actions secrets. With none set today, the .dmg is unsigned (runs
# after Gatekeeper bypass). Drop these secrets in later to enable notarization
# without code changes:
#   APPLE_CERTIFICATE        (base64 of Developer ID Application .p12)
#   APPLE_CERTIFICATE_PASSWORD
#   APPLE_SIGNING_IDENTITY   (e.g. "Developer ID Application: Your Name (TEAMID)")
#   APPLE_ID
#   APPLE_PASSWORD           (app-specific password)
#   APPLE_TEAM_ID

on:
  push:
    tags:
      - "v*"

  workflow_dispatch: # manual run from the Actions tab

permissions:
  contents: write # required by tauri-action to create/upload the Release

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # Publishes artifacts + creates/updates the GitHub Release.
      # tagName / releaseName/ releaseBody/ releaseDraft are derived from the
      # triggering git tag (e.g. v0.1.0). For workflow_dispatch the action
      # falls back to the latest tag on HEAD.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── macOS code signing / notarization (optional) ───────────────
          # Only consumed when populated; absence yields an unsigned build.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Prompter ${{ github.ref_name }}"
          releaseBody: "See the assets below to download this version."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
